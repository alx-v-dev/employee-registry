<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Реестр сотрудников" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Реестр сотрудников</a>
      {% if request.url.path != "/employees/new" and title != "Новый сотрудник" %}
        <a class="button primary" href="/employees/new">Добавить сотрудника</a>
      {% endif %}
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
