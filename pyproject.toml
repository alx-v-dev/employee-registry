[project]
name = "employee-registry"
version = "0.1.0"
description = "Server-rendered employee registry built with FastAPI."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
